[project]
name = "plat"
version = "0.1.0"
description = "Divide one ticket into lots, work them in parallel, close the traverse."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Justin Howard"}]
keywords = ["agents", "orchestration", "llm", "code-review", "claude", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "typer>=0.12",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "pyyaml>=6.0",
  "rich>=13.7",
  "textual>=0.80",
]

[project.optional-dependencies]
# Declared, not assumed. These were installed by hand for the whole of
# development and existed nowhere, so CI could not run a single test.
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",   # the TUI is driven through textual's async harness
  "ruff>=0.7",
]

[project.scripts]
plat = "plat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# F and I are the ones that catch real problems here: undefined names, unused
# imports, import order. The E rules below are deliberate style in this codebase
# rather than oversights, and suppressing them is honest where renaming 45 call
# sites to satisfy a linter is not.
select = ["E", "F", "I"]
ignore = [
  "E501",  # many long lines are comments carrying reasoning; wrapping them hurts
  "E702",  # `db.add(a); db.flush()` pairs two halves of one action on purpose
  "E741",  # `l` is a lot, consistently, in code that already says so
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/plat"]
