[project]
name = "plat"
version = "0.1.0"
description = "Divide one ticket into lots, work them in parallel, close the traverse."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "typer>=0.12",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.scripts]
plat = "plat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plat"]
