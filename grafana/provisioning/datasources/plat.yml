# Values come from the environment (see docker-compose.plat.yml) so no credential
# is committed and the same file works against any Postgres.
apiVersion: 1
datasources:
  - name: Plat
    uid: plat-pg
    type: postgres
    access: proxy
    url: $PLAT_DB_HOST:$PLAT_DB_PORT
    database: $PLAT_DB_NAME
    user: $PLAT_DB_USER
    secureJsonData:
      password: $PLAT_DB_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
    editable: false
