apiVersion: 1
providers:
  - name: plat
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: true      # edit in the browser, then export back to git
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
