<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plat · Team work</title><link rel="stylesheet" href="/board.css"></head><body>
<header><div><p class="eyebrow">PLAT / TEAM WORKSPACE</p><h1>Work, in view.</h1><p>Ownership, progress, reviews, and the decisions that connect them.</p></div><span id="connection">Not connected</span></header>
